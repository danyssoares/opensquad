<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background-color: #2D1942;
      color: #F5F2E8;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 80px 60px 60px 60px;
      position: relative;
    }
    
    .header {
      width: 100%;
      text-align: center;
      z-index: 10;
    }
    
    .date-transit {
      font-size: 22px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #F5F2E8;
    }
    
    .graphic-container {
      width: 100%;
      height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      position: relative;
      margin-top: -10px;
    }
    
    .central-image {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 40px rgba(201, 168, 76, 0.18));
    }
    
    .content-footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      z-index: 10;
    }
    
    .hook-text {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      color: #F5F2E8;
      max-width: 900px;
      letter-spacing: -0.01em;
    }
    
    .brand-footer {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 500;
      color: #C9A84C; /* Cor dourada oficial */
      letter-spacing: 2px;
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="date-transit">25/05 | MARTE QUADRATURA PLUTÃO</div>
  </div>
  
  <div class="graphic-container">
    <img class="central-image" src="key_constellations_graphic.png" alt="Visual Element">
  </div>
  
  <div class="content-footer">
    <div class="hook-text">A exaustão que você sustenta no braço tem um nome. E não é "responsabilidade".</div>
    <div class="brand-footer">@lualogica</div>
  </div>
</body>
</html>
